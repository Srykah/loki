name: check-format

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  check-format:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: jidicula/clang-format-action@v4.18.0
        with:
          check-path: src
          clang-format-version: 22
          fallback-style: Chromium
